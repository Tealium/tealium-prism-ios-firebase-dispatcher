name: Setup the machine
description: Selects Xcode and sets up Ruby with cached gems

runs:
  using: "composite"
  steps:
    - name: Runner - ${{ runner.name }}
      run: echo "${{ runner.name }}"
      shell: bash
    - name: "Run Local Action: Setup Xcode"
      uses: ./.github/workflows/setup-xcode
    - uses: ruby/setup-ruby@v1
      with:
        # Exact patch on purpose: it is part of the bundler-cache key, so '3.4' would turn every PR
        # cold whenever setup-ruby resolves a new 3.4.x. Bump it by hand; merging the bump re-seeds
        # via gems-cache-seed.yml.
        ruby-version: '3.4.12'
        bundler-cache: true
