name: Lint

on: [pull_request]

jobs:
  SwiftLint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Source
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --config .swiftlint.yml
      - name: Lint Tests
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --config .swiftlint_test.yml
