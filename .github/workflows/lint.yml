name: Lint

on: [pull_request]

permissions:
  contents: read

jobs:
  SwiftLint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint Source
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --config .swiftlint.yml
      - name: Lint Tests
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --config .swiftlint_test.yml
